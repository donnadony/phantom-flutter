name: phantom_flutter
description: A cross-platform debug toolkit for Flutter apps. Inspect logs, network requests, mock responses, config overrides, files, deep links, and more.
version: 0.0.6
homepage: https://github.com/donnadony/phantom-flutter

environment:
  sdk: ^3.9.2
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.0
  package_info_plus: '>=8.3.0 <12.0.0'
  device_info_plus: ^13.2.0
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  share_plus: ^13.3.0
  file_picker: ^12.1.1
  sensors_plus: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
